<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily P&amp;L Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily P&L">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#6b7280;--bd:#e3e6ea;--g:#0a8f4e;--r:#d33a3a;--ac:#2557d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--card:#181c24;--tx:#eef0f4;--mut:#98a0ad;--bd:#2a303b;--g:#35c27a;--r:#ff6b6b;--ac:#6c8cff}}
:root[data-theme="dark"]{--bg:#0f1218;--card:#181c24;--tx:#eef0f4;--mut:#98a0ad;--bd:#2a303b;--g:#35c27a;--r:#ff6b6b;--ac:#6c8cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding:14px;max-width:560px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 2px}
.cloud-badge{font-size:12px;color:var(--mut);display:inline-flex;align-items:center;gap:4px;margin-bottom:10px}
.cloud-badge.online{color:var(--g)}
.cloud-badge.warn{color:#eab308;cursor:pointer}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{padding:12px;border:0;border-radius:10px;font-size:16px;font-weight:600;background:var(--ac);color:#fff;width:100%;margin-top:12px;cursor:pointer}
button:active{opacity:0.85}
.tot{margin-top:10px;font-size:14px;color:var(--mut)}
.tot b{color:var(--tx)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{margin:0;background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:9px;font-size:14px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:500;font-size:12px}
.g{color:var(--g)}.r{color:var(--r)}
.big{font-size:26px;font-weight:700}
.del{background:none;color:var(--mut);padding:2px 8px;width:auto;margin:0;font-size:16px;border:none}
.top{display:flex;justify-content:space-between;align-items:center}
.top div button{width:auto;margin:0 0 0 6px;padding:7px 10px;font-size:13px;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
#lock{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#lock.hide{display:none}
#lock h2{margin:0 0 10px}
#lock input{max-width:220px;text-align:center;font-size:24px;letter-spacing:8px}
#lock button{max-width:220px}
#msg{color:var(--r);min-height:20px;font-size:14px;margin-top:8px}
</style>
</head>
<body>
<div id="lock">
  <h2>🔒 Daily P&amp;L</h2>
  <input type="password" id="pin" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="PIN">
  <button id="unlock">Unlock</button>
  <div id="msg"></div>
</div>

<div class="top">
  <div>
    <h1>Daily Profit &amp; Loss</h1>
    <div id="cloud-status" class="cloud-badge">☁️ Connecting to Supabase Cloud...</div>
  </div>
  <div><button id="exportbtn">📥 Excel</button><button id="chpin">Change PIN</button><button id="lockbtn">Lock</button></div>
</div>

<div class="card">
  <label>Date</label><input type="date" id="d">
  <div class="row">
    <div><label>Invested</label><input type="number" id="inv" inputmode="decimal" placeholder="0"></div>
    <div><label>Charges / Fees</label><input type="number" id="chg" inputmode="decimal" placeholder="0"></div>
  </div>
  <label>Profit (+) or Loss (−)</label><input type="number" id="pl" inputmode="decimal" placeholder="e.g. 500 or -300">
  <div class="tot">Total = Invested − Charges ± P/L: <b id="tt">0.00</b></div>
  <button id="save">Save day</button>
</div>

<div class="tabs">
  <button data-t="day" class="on">Days</button>
  <button data-t="mon">Monthly</button>
  <button data-t="fy">Year (Mar)</button>
</div>
<div class="card" id="view"></div>

<script>
var KEY = "pnl_entries_v1", data = [];
try { data = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch(e) { data = []; }
function persist() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e) {} }
var $ = function(i) { return document.getElementById(i); };
function today() { var t = new Date(); return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0"); }
function num(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }
function fmt(n) { return (n < 0 ? "−" : "") + Math.abs(n).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function cls(n) { return n > 0 ? "g" : n < 0 ? "r" : ""; }
function total(e) { return e.inv - e.chg + e.pl; }
var tab = "day";

/* ---- Supabase Real-time Cloud Sync ---- */
var SB_URL = "https://sbiywlaqhxahcgthmfqq.supabase.co";
var SB_KEY = "sb_publishable_sXC_B8LMO4lr3b0-KpGH1A_AHhonpXo";
var sb = null;
if (window.supabase && window.supabase.createClient) {
  try {
    sb = window.supabase.createClient(SB_URL, SB_KEY);
  } catch (err) {
    console.error("Supabase init error:", err);
  }
}

async function syncWithCloud() {
  var badge = $("cloud-status");
  if (!sb) {
    if (badge) badge.innerHTML = "☁️ Local Mode (Cloud SDK unavailable)";
    return;
  }
  try {
    var res = await sb.from("pnl_entries").select("*").order("date", { ascending: false });
    if (res.error) {
      if (badge) {
        badge.className = "cloud-badge warn";
        badge.innerHTML = "⚠️ Table 'pnl_entries' not created yet in SQL editor";
        badge.onclick = function() {
          alert("Please run the SQL snippet in your Supabase SQL Editor to activate live phone/laptop sync.");
        };
      }
      return;
    }
    
    // Cloud entries retrieved
    var cloudRows = res.data || [];
    var cloudMap = {};
    cloudRows.forEach(function(r) {
      cloudMap[r.date] = {
        date: r.date,
        inv: parseFloat(r.invested) || 0,
        chg: parseFloat(r.charges) || 0,
        pl: parseFloat(r.pl) || 0
      };
    });

    // If local entries exist that are not in cloud yet, push them to cloud
    var unsynced = data.filter(function(loc) { return !cloudMap[loc.date]; });
    if (unsynced.length > 0) {
      for (var u of unsynced) {
        await sb.from("pnl_entries").upsert({
          date: u.date,
          invested: u.inv,
          charges: u.chg,
          pl: u.pl,
          updated_at: new Date().toISOString()
        }, { onConflict: "date" });
        cloudMap[u.date] = u;
      }
    }

    // Merge into local state
    data = Object.values(cloudMap);
    persist();
    resetForm();
    render();

    if (badge) {
      badge.className = "cloud-badge online";
      badge.innerHTML = "🟢 Supabase Live Cloud Synced";
    }
  } catch (err) {
    console.error("Cloud sync error:", err);
    if (badge) badge.innerHTML = "☁️ Local Mode";
  }
}

function resetForm() {
  $("d").value = today();
  var last = data.slice().sort(function(a, b) { return a.date < b.date ? 1 : -1; })[0];
  $("inv").value = last ? last.inv : "";
  $("chg").value = ""; $("pl").value = ""; calc();
}
function calc() { $("tt").textContent = fmt(num($("inv").value) - num($("chg").value) + num($("pl").value)); }
["inv", "chg", "pl"].forEach(function(i) { $(i).addEventListener("input", calc); });

$("save").onclick = async function() {
  var date = $("d").value || today();
  var e = { date: date, inv: num($("inv").value), chg: num($("chg").value), pl: num($("pl").value) };
  var i = data.findIndex(function(x) { return x.date === date; });
  if (i >= 0) data[i] = e; else data.push(e);
  persist();
  resetForm();
  render();

  // Push to Supabase
  if (sb) {
    try {
      var badge = $("cloud-status");
      if (badge) badge.innerHTML = "🔄 Saving to Cloud...";
      await sb.from("pnl_entries").upsert({
        date: e.date,
        invested: e.inv,
        charges: e.chg,
        pl: e.pl,
        updated_at: new Date().toISOString()
      }, { onConflict: "date" });
      if (badge) {
        badge.className = "cloud-badge online";
        badge.innerHTML = "🟢 Supabase Live Cloud Synced";
      }
    } catch (err) {
      console.error("Save error:", err);
    }
  }
};

function fyOf(date) { var y = +date.slice(0, 4), m = +date.slice(5, 7); return m >= 4 ? y : y - 1; }
function group(keyFn) {
  var g = {};
  data.forEach(function(e) {
    var k = keyFn(e.date); g[k] = g[k] || { inv: 0, chg: 0, pl: 0, n: 0 };
    g[k].inv += e.inv; g[k].chg += e.chg; g[k].pl += e.pl; g[k].n++;
  });
  return g;
}
function table(rows, head) {
  return "<div class='scroll'><table><tr>" + head.map(function(x) { return "<th>" + x + "</th>"; }).join("") + "</tr>" + rows + "</table></div>";
}
function render() {
  var v = $("view"), html = "";
  if (!data.length) { v.innerHTML = "<div class='tot'>No entries yet. Add your first day above.</div>"; return; }
  if (tab === "day") {
    var rows = data.slice().sort(function(a, b) { return a.date < b.date ? 1 : -1; }).map(function(e) {
      return "<tr><td>" + e.date.slice(8) + "/" + e.date.slice(5, 7) + "/" + e.date.slice(2, 4) + "</td><td>" + fmt(e.inv) + "</td><td>" + fmt(e.chg) + "</td><td class='" + cls(e.pl) + "'>" + fmt(e.pl) + "</td><td><b>" + fmt(total(e)) + "</b></td><td><button class='del' data-d='" + e.date + "'>✕</button></td></tr>";
    }).join("");
    html = table(rows, ["Date", "Invested", "Charges", "P/L", "Total", ""]);
  } else if (tab === "mon") {
    var g = group(function(d) { return d.slice(0, 7); });
    var rows2 = Object.keys(g).sort().reverse().map(function(k) {
      var s = g[k], nt = s.pl - s.chg;
      return "<tr><td>" + k.slice(5) + "/" + k.slice(0, 4) + "</td><td>" + s.n + "</td><td>" + fmt(s.chg) + "</td><td class='" + cls(s.pl) + "'>" + fmt(s.pl) + "</td><td class='" + cls(nt) + "'><b>" + fmt(nt) + "</b></td></tr>";
    }).join("");
    html = table(rows2, ["Month", "Days", "Charges", "P/L", "Net"]);
  } else {
    var f = group(function(d) { return fyOf(d); });
    html = Object.keys(f).sort().reverse().map(function(k) {
      var s = f[k], nt = s.pl - s.chg;
      return "<div style='margin-bottom:14px'><div class='tot'>FY " + k + "–" + (+k + 1) + " (Apr to Mar)</div><div class='big " + cls(nt) + "'>" + fmt(nt) + "</div><div class='tot'>Gross P/L <b class='" + cls(s.pl) + "'>" + fmt(s.pl) + "</b> · Charges <b>" + fmt(s.chg) + "</b> · " + s.n + " days</div></div>";
    }).join("");
  }
  v.innerHTML = html;
  Array.prototype.forEach.call(v.querySelectorAll(".del"), function(b) {
    b.onclick = async function() {
      if (confirm("Delete this day?")) {
        var dDate = b.dataset.d;
        data = data.filter(function(x) { return x.date !== dDate; });
        persist();
        render();
        if (sb) {
          try {
            await sb.from("pnl_entries").delete().eq("date", dDate);
          } catch (err) {
            console.error("Delete error:", err);
          }
        }
      }
    };
  });
}
Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function(b) {
  b.onclick = function() {
    tab = b.dataset.t;
    Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function(x) { x.classList.toggle("on", x === b); });
    render();
  };
});

/* ---- PIN lock (casual protection only; default PIN 1359) ---- */
var PK = "pnl_pin_v1";
function hp(s) { var h = 5381; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return String(h); }
function getPin() { try { return localStorage.getItem(PK) || hp("1359"); } catch(e) { return hp("1359"); } }
function setPin(p) { try { localStorage.setItem(PK, hp(p)); } catch(e) {} }
function showLock() { $("lock").classList.remove("hide"); $("pin").value = ""; $("msg").textContent = ""; $("pin").focus(); }
function tryUnlock() {
  if (hp($("pin").value) === getPin()) {
    $("lock").classList.add("hide");
    $("pin").value = "";
    syncWithCloud();
  } else {
    $("msg").textContent = "Wrong PIN";
    $("pin").value = "";
  }
}
$("unlock").onclick = tryUnlock;
$("pin").addEventListener("keydown", function(e) { if (e.key === "Enter") tryUnlock(); });
$("lockbtn").onclick = showLock;
$("chpin").onclick = function() {
  var o = prompt("Current PIN"); if (o === null) return;
  if (hp(o) !== getPin()) { alert("Wrong PIN"); return; }
  var n = prompt("New PIN (4–8 digits)"); if (n === null) return;
  if (!/^\d{4,8}$/.test(n)) { alert("PIN must be 4–8 digits"); return; }
  setPin(n); alert("PIN changed");
};

function exportToExcel() {
  if (!data || !data.length) {
    alert("No trades recorded yet to export!");
    return;
  }
  var sorted = data.slice().sort(function(a, b) { return a.date > b.date ? 1 : -1; });
  var csvContent = "\uFEFF"; // UTF-8 BOM so Microsoft Excel cleanly renders formatting & numbers
  csvContent += "Date,Invested (INR),Charges & Taxes (INR),Gross P/L (INR),Net Profit/Loss (INR),Final Balance (INR),Trade Status\n";
  
  var totChg = 0, totGross = 0, totNet = 0;
  sorted.forEach(function(e) {
    var net = e.pl - e.chg;
    var tot = e.inv - e.chg + e.pl;
    var status = e.pl > 0 ? "PROFIT" : (e.pl < 0 ? "LOSS" : "BREAKEVEN");
    totChg += e.chg; totGross += e.pl; totNet += net;
    var dParts = e.date.split("-");
    var dFormatted = dParts[2] + "/" + dParts[1] + "/" + dParts[0];
    csvContent += [
      dFormatted,
      e.inv.toFixed(2),
      e.chg.toFixed(2),
      e.pl.toFixed(2),
      net.toFixed(2),
      tot.toFixed(2),
      status
    ].join(",") + "\n";
  });

  csvContent += "\n";
  csvContent += "--- INCOME TAX / AUDIT SUMMARY ---\n";
  csvContent += "Total Trading Days," + sorted.length + "\n";
  csvContent += "Total Statutory Charges & STT (INR)," + totChg.toFixed(2) + "\n";
  csvContent += "Total Gross Profit/Loss (INR)," + totGross.toFixed(2) + "\n";
  csvContent += "Total Net Taxable Realized P/L (INR)," + totNet.toFixed(2) + "\n";

  var blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  var url = URL.createObjectURL(blob);
  var link = document.createElement("a");
  link.setAttribute("href", url);
  link.setAttribute("download", "AuraAI_Trading_PnL_Tax_Report_" + today() + ".csv");
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}
$("exportbtn").onclick = exportToExcel;

showLock();
resetForm();
render();
syncWithCloud();
</script>
</body>
</html>
